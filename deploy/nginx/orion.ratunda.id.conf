# CUTOVER A — orion.ratunda.id now serves the ERPNext-backed Orion:
# feynman SPA at root, Frappe paths proxied to the frontend container.
# The container routes sites by Host header, so Host is forced to the
# internal site name erp.ratunda.id.
#
# ROLLBACK: restore the previous vhost (proxy_pass http://localhost:3000)
# and `pm2 start bellatrix bellatrix-python` — orion_db is untouched.
server {
    server_name orion.ratunda.id;

    client_max_body_size 60M;
    root /opt/erpnext/feynman-dist;
    index index.html;

    location ~ ^/(api|app|assets|files|private|method|socket\.io|recorder|api-docs)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host erp.ratunda.id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /orion-assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a browser holding the pre-cutover
    # bundle keeps calling the dead bellatrix endpoints. Hashed bundles under
    # /orion-assets are immutable and cache forever (above).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
        expires off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/orion.ratunda.id/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/orion.ratunda.id/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = orion.ratunda.id) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name orion.ratunda.id;
    return 404; # managed by Certbot
}
