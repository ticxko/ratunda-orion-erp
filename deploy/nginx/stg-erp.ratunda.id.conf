# Staging target topology: feynman SPA at root, ERPNext behind the Frappe
# paths. This is the production serving model (plan §5.4) validated on staging.
# TLS managed by certbot (see the 443 block appended by --nginx).
server {
    listen 80;
    server_name stg-erp.ratunda.id;

    client_max_body_size 60M;
    root /opt/erpnext/feynman-dist;
    index index.html;

    # Frappe-owned paths -> the frontend container (multi-site by Host header).
    location ~ ^/(api|app|assets|files|private|method|socket\.io|recorder|api-docs)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    # feynman's own bundles, served from disk.
    location /orion-assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: every other path renders feynman's client-side router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
